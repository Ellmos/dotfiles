env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

exec-once = waybar & hyprpaper & alacritty -e ~/.config/hypr/scripts/update_brave.sh

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true

    layout = dwindle
}

windowrule = bordercolor rgba(9933ffee) rgba(33ccffee) 45deg, fullscreen:1

decoration {
    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = yes
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

input {
    kb_layout = fr, us
    kb_options=grp:win_space_toggle

    numlock_by_default = true
    repeat_delay = 250

    follow_mouse = 1

    accel_profile = flat

    sensitivity = 0.75
    touchpad {
        natural_scroll = yes
        scroll_factor = 0.75
    }
}

gestures {
    workspace_swipe_create_new = false
    workspace_swipe_distance = 100
}
gesture = 4, horizontal, workspace
gesture = 3, down, fullscreen, maximize

misc {
    force_default_wallpaper = 0
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
    initial_workspace_tracking = 2
}

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# -------------- Monitors --------------
# --- PC
# monitor=eDP-1, 1920x1080@60, 0x0, 1
# monitor=DP-1, 1920x1080@60, 1920x0, 1

# --- Tele
# monitor=eDP-1, 1920x1080@60, 0x0, 1
# monitor=HDMI-A-1, 1920x1080@60, 1920x0, 1

# --- Screen mirroring
# monitor =, preferred, auto, 1, mirror, eDP-1

# --- Should place the new screen to the right of the main screen
monitor = , preferred, auto-right, 1



$mod = SUPER

# -------------- Main binds --------------
bind = $mod, Return, exec, alacritty
bind = $mod SHIFT, A, killactive, 
bind = $mod SHIFT, E, exec, bash ~/.config/rofi/powermenu.sh
bind = $mod, F, fullscreen, 0 # fullscreen
bind = $mod SHIFT, F, fullscreen, 1 # Maximize
bind = $mod, D, exec, rofi -show drun -theme ~/.config/rofi/themes/drun.rasi
bind = $mod SHIFT, D, exec, rofi -show run -theme ~/.config/rofi/themes/run.rasi
bind = $mod, W, exec, rofi -show window -theme ~/.config/rofi/themes/window.rasi
bind = $mod, B, exec, /usr/bin/brave-browser-stable --enable-features=TouchpadOverscrollHistoryNavigation
bind = $mod, P, exec, hyprlock
bind = $mod SHIFT, space, togglefloating,

# -------------- Sound --------------
bind =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# -------------- Media control --------------
bind =, XF86AudioPrev, exec, playerctl previous
bind =, XF86AudioPlay, exec, playerctl play-pause
bind =, XF86AudioNext, exec, playerctl next

# -------------- Brightness --------------
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%

# -------------- Screenshot --------------
bind= ,Print,exec, ~/.local/bin/hyprshot -m region
bind = SHIFT, Print, exec, ~/.local/bin/hyprshot -m window

# -------------- Calculator --------------
bind = ,XF86Calculator, exec, gnome-calculator
windowrulev2 = float,class:^(org.gnome.Calculator)$,title:^(Calculator)$

# -------------- Files explorer --------------
bind = $mod, E, exec, nautilus --new-window
windowrulev2 = float,class:^(org.gnome.Nautilus)$
windowrulev2 = size 70% 80%, class:^(org.gnome.Nautilus)$
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 70% 80%, class:^(xdg-desktop-portal-gtk)$

# -------------- Move focus with arrow --------------
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# -------------- Move focus with hjkl --------------
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# -------------- Move window with arrow --------------
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# -------------- Move window with hjkl --------------
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# -------------- Switch workspaces --------------
bind = $mod, ampersand, workspace, 1
bind = $mod, eacute, workspace, 2
bind = $mod, quotedbl, workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft, workspace, 5
bind = $mod, minus, workspace, 6
bind = $mod, egrave, workspace, 7
bind = $mod, underscore, workspace, 8
bind = $mod, ccedilla, workspace, 9
bind = $mod, agrave, workspace, 10

# -------------- Move active window to a different workspace --------------
bind = $mod SHIFT, ampersand, movetoworkspacesilent, 1
bind = $mod SHIFT, eacute, movetoworkspacesilent, 2
bind = $mod SHIFT, quotedbl, movetoworkspacesilent, 3
bind = $mod SHIFT, apostrophe, movetoworkspacesilent, 4
bind = $mod SHIFT, parenleft, movetoworkspacesilent, 5
bind = $mod SHIFT, minus, movetoworkspacesilent, 6
bind = $mod SHIFT, egrave, movetoworkspacesilent, 7
bind = $mod SHIFT, underscore, movetoworkspacesilent, 8
bind = $mod SHIFT, ccedilla, movetoworkspacesilent, 9
bind = $mod SHIFT, agrave, movetoworkspacesilent, 10

# -------------- Scroll through existing workspaces with mod + scroll --------------
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# -------------- Move/resize windows with mod + LMB/RMB and dragging --------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# -------------- Lock on lid closed --------------
bindl =,switch:on:Lid Switch,exec,hyprlock
